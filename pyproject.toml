[project]
name = "pyramid_temporal"
version = "0.1.3"
description = "This project bind the config and transaction from pyramid to temporal"
authors = [{ name = "Robbin dev team", email = "fdev@robbin.com.br" }]
requires-python = ">=3.10,<4.0"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "temporalio>=1.15.0,<2",
    "transaction>=5.0,<6",
    "zope-interface>=7.2,<8",
    "pyramid>=2.0.2,<3",
    "click>=8.1.0,<9",
    "sqlalchemy>=2.0.43,<3",
    "zope-sqlalchemy>=3.1,<4",
]

[project.urls]
Repository = "https://github.com/cartaorobbin/pyramid-temporal"
Documentation = "https://cartaorobbin.github.io/pyramid-temporal/"

[project.scripts]
ptemporal-worker = "pyramid_temporal.cli:ptemporal_worker"

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9",
    "pytest-cov>=4.0.0,<5",
    "deptry>=0.6.4,<0.7",
    "mypy>=0.981,<0.982",
    "pre-commit>=2.20.0,<3",
    "tox>=3.25.1,<4",
    "alembic>=1.16.4,<2",
    "psycopg2-binary>=2.9.10,<3",
    "pyramid-tm>=2.6,<3",
    "testing-postgresql>=1.3.0,<2",
    "webtest>=3.0.6,<4",
    "pytest-asyncio>=1.1.0,<2",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocstrings>=0.29.1,<0.30",
    "mkdocstrings-python>=1.16.10,<2",
]

[tool.uv]
default-groups = [
    "dev",
    "docs",
]

[tool.uv.build-backend]
module-name = ["pyramid_temporal"]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.black]
line-length = 120
target-version = ['py37']
preview = true

[tool.mypy]
files = ["pyramid_temporal"]
disallow_untyped_defs = "True"
disallow_any_unimported = "True"
no_implicit_optional = "True"
check_untyped_defs = "True"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"

[tool.ruff]
target-version = "py37"
line-length = 120
fix = true
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]

[tool.deptry]
extend_exclude = [
    "tests",
    "example.py",
    "examples",
]
# These are peer dependencies - users need them but pyramid-temporal
# doesn't directly import them (it uses real Pyramid requests which
# the user configures with dbsession, tm, etc.)
ignore_obsolete = [
    "sqlalchemy",
    "zope-interface",
    "zope-sqlalchemy",
]

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["pyramid_temporal"]


